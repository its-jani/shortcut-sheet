[package]
name = "shortcut-sheet"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "Hold a key, see the shortcuts for the app you are in. Clean-room, open-source desktop utility."
license = "MIT"
repository = "https://github.com/its-jani/shortcut-sheet"

[[bin]]
name = "shortcut-sheet"
path = "src/main.rs"

[dependencies]
# glow only: the default feature set of eframe 0.37 also pulls wgpu + vello, which is
# pure waste (and working-set) for a single small overlay window.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.37"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# The exe has no console, so diagnostics go to a rolling file in the data directory.
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # SetWinEventHook / UnhookWinEvent live here, and the foreground-change watch needs them:
    # it is what lets the open panel stop polling for "did the user move on" (BUG-007).
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
] }

[dev-dependencies]

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "debuginfo"
